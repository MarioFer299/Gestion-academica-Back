<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Subida - FocusLab</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 500px; margin: 0 auto; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 25px; padding: 12px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <h2>📤 Prueba de Subida de Archivos</h2>
    <p>Este formulario enviará el archivo directamente a tu backend local.</p>
    
    <!-- El action apunta a tu servidor local y enctype permite enviar archivos -->
    <form action="http://localhost:4000/api/resources" method="POST" enctype="multipart/form-data">
        
        <label>1. Selecciona un archivo (PDF, imagen, etc.):</label>
        <input type="file" name="file" required>
        
        <label>2. Título del recurso:</label>
        <input type="text" name="title" value="Guía de Estudio" required>
        
        <label>3. ID de la Materia:</label>
        <input type="text" name="subjectId" value="117c88bc-98d4-4db1-88dc-408a90a2d3ba" required>
        
        <label>4. ID del Usuario (Admin):</label>
        <input type="text" name="uploadedById" value="839a18a8-66df-4a75-b1f2-b8bb5f8bbba5" required>
        
        <button type="submit">Subir Archivo al Servidor</button>
    </form>
</body>
</html>
